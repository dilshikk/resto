services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mado_checklist
      POSTGRES_USER: mado_staff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mado_staff -d mado_checklist"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: migrate/Dockerfile
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: mado_staff
      PGDATABASE: mado_checklist
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://mado_staff:${POSTGRES_PASSWORD}@db:5432/mado_checklist
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3001,https://staff.mado.uz}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      BOT_TOKEN: ${BOT_TOKEN}
      MANAGERS_CHAT_ID: ${MANAGERS_CHAT_ID:-}
      PHOTOS_DIR: /data/uploads
      # FaceID attendance — separate PostgreSQL database.
      # Format: postgresql+asyncpg://user:pass@host:port/dbname
      # Leave empty to disable the /attendance/* endpoints (returns 503).
      ATTENDANCE_DATABASE_URL: ${ATTENDANCE_DATABASE_URL:-}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://backend:8000/api/v1
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
