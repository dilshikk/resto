services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mado_checklist
      # The production volume was created with this role; keep it in sync
      # with backend DATABASE_URL and the migrate service.
      POSTGRES_USER: mado_staff
      # Required — no fallback. Set in .env or the environment.
      # Generate with: openssl rand -hex 24
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is managed by the `migrate` service below (not initdb scripts),
      # so new migrations are applied to existing databases as well.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mado_staff -d mado_checklist"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: applies pending SQL files from backend/migrations and exits.
  # Runs automatically on every `docker compose up`. Manual run:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: ./backend
      dockerfile: migrate/Dockerfile
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: mado_staff
      PGDATABASE: mado_checklist
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://mado_staff:${POSTGRES_PASSWORD}@db:5432/mado_checklist
      # Required — no fallback. Set in .env or the environment.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3001,https://staff.mado.uz}
      # Required — no fallback. Set in .env or the environment.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      # Optional: used by the backend to push Telegram notifications directly
      # (approve / reject). If unset, those pushes are silently skipped.
      BOT_TOKEN: ${BOT_TOKEN}
      PHOTOS_DIR: /data/uploads
    volumes:
      # Checklist item photos previously lived in /tmp, which docker wipes on
      # every restart/rebuild. Mounting a named volume here means uploaded
      # photos now survive `docker compose up --build`, container restarts,
      # and host reboots.
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      # Backend starts only after the schema is up to date.
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://backend:8000/api/v1
      # Must match BOT_INTERNAL_SECRET set on the backend service.
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
