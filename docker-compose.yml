version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mado_checklist
      POSTGRES_USER: mado
      # Required — no fallback. Set in .env or the environment.
      # Generate with: openssl rand -hex 24
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: these scripts run ONLY when the database volume is empty.
      # For an existing database apply new migrations manually, e.g.:
      #   docker compose exec -T db psql -U mado -d mado_checklist < backend/migrations/018_roles_branches_bot_token.sql
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./backend/migrations/002_checklists.sql:/docker-entrypoint-initdb.d/002_checklists.sql
      - ./backend/migrations/003_issues.sql:/docker-entrypoint-initdb.d/003_issues.sql
      - ./backend/migrations/004_shifts_notifications.sql:/docker-entrypoint-initdb.d/004_shifts_notifications.sql
      - ./backend/migrations/005_photos.sql:/docker-entrypoint-initdb.d/005_photos.sql
      - ./backend/migrations/006_standards.sql:/docker-entrypoint-initdb.d/006_standards.sql
      - ./backend/migrations/007_audit_logs.sql:/docker-entrypoint-initdb.d/007_audit_logs.sql
      - ./backend/migrations/008_checklist_item_skip.sql:/docker-entrypoint-initdb.d/008_checklist_item_skip.sql
      - ./backend/migrations/009_telegram.sql:/docker-entrypoint-initdb.d/009_telegram.sql
      - ./backend/migrations/010_revoked_tokens.sql:/docker-entrypoint-initdb.d/010_revoked_tokens.sql
      - ./backend/migrations/011_checklist_deadlines.sql:/docker-entrypoint-initdb.d/011_checklist_deadlines.sql
      - ./backend/migrations/012_2fa_totp.sql:/docker-entrypoint-initdb.d/012_2fa_totp.sql
      - ./backend/migrations/013_photo_comment_requirements.sql:/docker-entrypoint-initdb.d/013_photo_comment_requirements.sql
      - ./backend/migrations/014_checklist_item_requirements.sql:/docker-entrypoint-initdb.d/014_checklist_item_requirements.sql
      - ./backend/migrations/015_checklist_escalation.sql:/docker-entrypoint-initdb.d/015_checklist_escalation.sql
      - ./backend/migrations/016_i18n.sql:/docker-entrypoint-initdb.d/016_i18n.sql
      - ./backend/migrations/017_task_types.sql:/docker-entrypoint-initdb.d/017_task_types.sql
      - ./backend/migrations/018_roles_branches_bot_token.sql:/docker-entrypoint-initdb.d/018_roles_branches_bot_token.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mado -d mado_checklist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://mado:${POSTGRES_PASSWORD}@db:5432/mado_checklist
      # Required — no fallback. Set in .env or the environment.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3001,https://yourdomain.com}
      # Required — no fallback. Set in .env or the environment.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      PHOTOS_DIR: /data/uploads
    volumes:
      # Checklist item photos previously lived in /tmp, which docker wipes on
      # every restart/rebuild. Mounting a named volume here means uploaded
      # photos now survive `docker compose up --build`, container restarts,
      # and host reboots.
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://backend:8000/api/v1
      # Must match BOT_INTERNAL_SECRET set on the backend service.
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
